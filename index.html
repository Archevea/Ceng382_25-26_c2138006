<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharingan</title>
    <!-- Connecting the CSS file -->
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" type="x-icon" href="media/logo-vector.png">
</head>
<body>
    <!-- Setting up the live background -->
    <video id="backgroundVideo" autoplay loop muted>
        <source src="media/background_4k.mp4" type="video/mp4">
    </video>

    <div id="clock"></div>
    
    <!-- I took the css art from https://codepen.io/youssef-neinaa/pen/mdrYqmv -->
    <div class="gan">
        <div class="timwi-group">
          <span class="timwi timwi-one"></span>
          <span class="timwi timwi-two"></span>
          <span class="timwi timwi-three"></span>
        </div>
    </div>

    <!-- The button for hides, shows the register form and stops the live background -->
    <button id="toggleButton"></button>

    <!-- Register Form -->
    <div class="container" id="registerContainer">
        <h2>Create Your Character!</h2>
        <form id="registerForm">
            <input type="text" id="username" placeholder="Nickname" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="button" id="loginBtn">Submit</button>
        </form>
    </div>   
      
    <!-- Connecting the js file -->
    <script src="script.js"></script>
</body>
</html>
